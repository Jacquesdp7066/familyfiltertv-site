<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">

    </nav>

</header>

<main class="wrap">
  <h1 class="page-title">TikTok</h1>
  <p class="lead" id="status">Checking the result…</p>
  <p id="detail"></p>
  <div class="actions"><a class="btn-quiet" href="tiktok-publisher.html">Back to the TikTok publisher</a></div>

</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),s=document.getElementById('status'),d=document.getElementById('detail'),saved=null;
  try{saved=sessionStorage.getItem('tiktok_state')}catch(e){}
  if(q.get('error')){s.textContent='TikTok did not connect.';d.textContent=(q.get('error_description')||q.get('error'));return}
  if(!q.get('code')){s.textContent='Nothing to show here.';return}
  try{sessionStorage.removeItem('tiktok_state')}catch(e){}
  if(!saved||saved!==q.get('state')){s.textContent='This sign-in did not start on our publisher page, so it was ignored.';return}
  s.textContent='TikTok account connected.';
  d.innerHTML='Copy this one-time code into the upload tool on the team computer: <code id="code"></code>';
  document.getElementById('code').textContent=q.get('code');
  history.replaceState(null,'',location.pathname);
})();
</script>
</body>
